<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-pop Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root{--pink:#FF6B9D;--purple:#9B59B6;--yellow:#FFD93D;--mint:#6BCB77;--blue:#4D96FF;--text:#2D1B4E;--muted:#8B7BA8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:#1a0a2e;color:var(--text);min-height:100vh;overflow-x:hidden;}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 20% 30%,#3d0066 0%,transparent 55%),radial-gradient(ellipse at 80% 70%,#1a0050 0%,transparent 55%),linear-gradient(160deg,#0d0020,#1a0035,#0a001a);}
.floatie{position:absolute;opacity:0;animation:floatup linear infinite;}
@keyframes floatup{0%{opacity:0;transform:translateY(0)}10%{opacity:.7}80%{opacity:.4}100%{opacity:0;transform:translateY(-100vh)}}
.stage-bar{position:fixed;bottom:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#ff6b9d,#9b59b6,#4d96ff,#ff6b9d);background-size:200%;animation:bar 3s linear infinite;z-index:5;}
@keyframes bar{0%{background-position:0%}100%{background-position:200%}}
header{position:sticky;top:0;z-index:100;background:rgba(26,10,46,.93);backdrop-filter:blur(12px);padding:11px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,107,157,.25);}
.logo{font-family:'Fredoka One',cursive;color:#fff;font-size:20px;}
.pills{display:flex;gap:10px;}
.pill{background:rgba(255,255,255,.1);color:#fff;border-radius:30px;padding:5px 13px;font-size:13px;font-weight:700;border:1px solid rgba(255,107,157,.3);}
nav{display:flex;gap:7px;overflow-x:auto;padding:12px 16px 6px;scrollbar-width:none;position:relative;z-index:10;}
nav::-webkit-scrollbar{display:none;}
.nb{flex-shrink:0;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:40px;padding:7px 14px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;color:rgba(255,255,255,.7);transition:all .2s;}
.nb:hover{background:rgba(255,255,255,.15);}
.nb.on{color:#fff;border-color:transparent;}
.nb.on.c1{background:linear-gradient(135deg,#FF6B9D,#e91e8c);}
.nb.on.c2{background:linear-gradient(135deg,#4D96FF,#2979FF);}
.nb.on.c3{background:linear-gradient(135deg,#6BCB77,#43A047);}
.nb.on.c4{background:linear-gradient(135deg,#FFD93D,#FB8C00);}
.nb.on.c5{background:linear-gradient(135deg,#9B59B6,#6A1B9A);}
.nb.on.c6{background:linear-gradient(135deg,#FF9A3C,#E64A19);}
.nb.on.c7{background:linear-gradient(135deg,#26C6DA,#0097A7);}
.nb.on.c8{background:linear-gradient(135deg,#FF6B9D,#9B59B6);}
.nb.on.c9{background:linear-gradient(135deg,#FFD93D,#FF9A3C);}
.nb.on.c10{background:linear-gradient(135deg,#26C6DA,#6BCB77);}
main{padding:10px 16px 80px;max-width:680px;margin:0 auto;position:relative;z-index:10;}
.card{background:rgba(255,255,255,.97);border-radius:20px;padding:20px;box-shadow:0 8px 40px rgba(0,0,0,.4);min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;}
.card.c1::before{background:linear-gradient(90deg,#FF6B9D,#e91e8c);}
.card.c2::before{background:linear-gradient(90deg,#4D96FF,#2979FF);}
.card.c3::before{background:linear-gradient(90deg,#6BCB77,#43A047);}
.card.c4::before{background:linear-gradient(90deg,#FFD93D,#FB8C00);}
.card.c5::before{background:linear-gradient(90deg,#9B59B6,#6A1B9A);}
.card.c6::before{background:linear-gradient(90deg,#FF9A3C,#E64A19);}
.card.c7::before{background:linear-gradient(90deg,#26C6DA,#0097A7);}
.card.c8::before{background:linear-gradient(90deg,#FF6B9D,#9B59B6);}
.card.c9::before{background:linear-gradient(90deg,#FFD93D,#FF9A3C);}
.card.c10::before{background:linear-gradient(90deg,#26C6DA,#6BCB77);}
.glabel{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.biglet{font-family:'Fredoka One',cursive;font-size:88px;line-height:1;background:linear-gradient(135deg,#FF6B9D,#9B59B6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:4px 0;}
.qtxt{font-size:18px;font-weight:800;text-align:center;margin-bottom:12px;}
.sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:400px;}
.opt{padding:12px 8px;border:2.5px solid #EDE0F5;border-radius:14px;background:#FAFAFA;color:var(--text);font-size:14px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .18s;text-align:center;}
.opt:hover:not(:disabled){border-color:var(--pink);transform:translateY(-2px);background:#FFF0F8;}
.opt.ok{background:#E8F5E9;border-color:#43A047;color:#1B5E20;}
.opt.no{background:#FFEBEE;border-color:#E53935;color:#7F0000;}
.opt:disabled{cursor:default;}
.fb{margin-top:10px;font-size:16px;font-weight:800;text-align:center;min-height:24px;}
.fb.ok{color:#43A047;}
.fb.no{color:#E53935;}
.nxt{margin-top:12px;background:linear-gradient(135deg,#FF6B9D,#9B59B6);color:#fff;border:none;border-radius:40px;padding:10px 28px;font-size:15px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;transition:transform .15s;box-shadow:0 4px 15px rgba(155,89,182,.35);}
.nxt:hover{transform:scale(1.05);}
.wdisp{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0;}
.wch{width:38px;height:48px;border-bottom:4px solid #9B59B6;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;font-family:'Fredoka One',cursive;}
.wch.bl{color:var(--pink);border-bottom-color:var(--pink);}
.lpool{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
.lbtn{width:46px;height:46px;border:2.5px solid #EDE0F5;border-radius:12px;background:#FAFAFA;color:var(--text);font-size:20px;font-weight:800;font-family:'Fredoka One',cursive;cursor:pointer;transition:all .15s;}
.lbtn:hover:not(:disabled){border-color:var(--pink);background:#FFF0F8;}
.lbtn.ok{background:#E8F5E9;border-color:#43A047;color:#1B5E20;}
.lbtn.no{background:#FFEBEE;border-color:#E53935;color:#7F0000;}
.slots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:7px 0 12px;}
.slot{width:40px;height:48px;border-bottom:4px solid var(--pink);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:var(--text);font-family:'Fredoka One',cursive;}
.slot.filled{background:#FFF0F8;border-radius:8px 8px 0 0;}
.spool{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;}
.sbtn{padding:8px 13px;border:2.5px solid #EDE0F5;border-radius:12px;background:#FAFAFA;color:var(--text);font-size:18px;font-weight:800;font-family:'Fredoka One',cursive;cursor:pointer;transition:all .15s;}
.sbtn:hover:not(.used){border-color:var(--pink);background:#FFF0F8;}
.sbtn.used{opacity:.3;pointer-events:none;}
.math{font-family:'Fredoka One',cursive;font-size:50px;text-align:center;margin:8px 0;color:var(--purple);}
.math .q{color:var(--pink);}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:340px;}
.mc{aspect-ratio:1;border-radius:12px;border:2.5px solid #EDE0F5;cursor:pointer;position:relative;transform-style:preserve-3d;}
.mc .mf,.mc .mb{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;transition:transform .4s;}
.mc .mf{background:linear-gradient(135deg,#9B59B6,#6A1B9A);font-size:20px;color:rgba(255,255,255,.3);}
.mc .mb{background:#fff;font-size:28px;transform:rotateY(180deg);border:2px solid #EDE0F5;}
.mc.flip .mf{transform:rotateY(180deg);}
.mc.flip .mb{transform:rotateY(0);}
.mc.mat{opacity:.45;pointer-events:none;}
.copts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
.cbtn{width:54px;height:54px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .15s;}
.cbtn:hover{transform:scale(1.15);}
.cbtn.ok{border-color:#43A047;box-shadow:0 0 0 4px #A5D6A7;}
.cbtn.no{border-color:#E53935;box-shadow:0 0 0 4px #FFCDD2;}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px;width:190px;height:190px;}
.sbtn2{border-radius:50%;border:none;cursor:pointer;filter:brightness(.7);transition:filter .15s,transform .1s;}
.sbtn2.s0{background:#E53935;}.sbtn2.s1{background:#43A047;}.sbtn2.s2{background:#FFD600;}.sbtn2.s3{background:#4D96FF;}
.sbtn2.lit{filter:brightness(1.5);transform:scale(1.08);}
.anim{font-size:68px;margin:5px 0;}
.aname{font-size:18px;font-weight:800;color:var(--purple);margin-bottom:8px;}
/* TTT */
.ttt-wrap{display:flex;flex-direction:column;align-items:center;gap:9px;width:100%;}
.mc-cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:360px;}
.mc-card{border:2.5px solid #EDE0F5;border-radius:16px;padding:14px 8px;background:#FAFAFA;cursor:pointer;text-align:center;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:5px;}
.mc-card:hover{border-color:var(--pink);background:#FFF0F8;transform:translateY(-3px);}
.mc-card .mci{font-size:32px;}
.mc-card .mct{font-size:13px;font-weight:800;color:var(--text);}
.mc-card .mcs{font-size:11px;color:var(--muted);}
.diff-row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;}
.dbtn{padding:7px 16px;border:2px solid #EDE0F5;border-radius:30px;background:#FAFAFA;color:var(--muted);font-size:12px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .15s;}
.dbtn:hover{border-color:var(--purple);color:var(--purple);}
.tbar{display:flex;align-items:center;justify-content:center;gap:9px;padding:7px 14px;border-radius:30px;font-size:13px;font-weight:800;width:100%;max-width:300px;}
.tbar.tA{background:#FFF0F8;color:#e91e8c;border:2px solid #FFB3C6;}
.tbar.tB{background:#F3E5FF;color:#7B1FA2;border:2px solid #CE93D8;}
.tbar.think{background:#EEF4FF;color:#1565C0;border:2px solid #90CAF9;animation:pulse .8s ease-in-out infinite alternate;}
@keyframes pulse{0%{opacity:.7}100%{opacity:1}}
.tboard{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;max-width:280px;}
.tcell{aspect-ratio:1;border:2.5px solid #EDE0F5;border-radius:14px;background:#FAFAFA;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.tcell:hover:not(.taken):not(.blocked){background:#FFF0F8;border-color:var(--pink);transform:scale(1.05);}
.tcell.taken,.tcell.blocked{cursor:default;}
.tcell.win{background:linear-gradient(135deg,#FFF0F8,#F3E5FF);border-color:var(--pink);animation:wc .5s ease;}
@keyframes wc{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.tsc{display:flex;gap:7px;justify-content:center;width:100%;max-width:300px;}
.tsc-item{flex:1;text-align:center;background:#F8F0FF;border-radius:12px;padding:6px 5px;}
.tsc-item .tsl{font-size:10px;color:var(--muted);font-weight:700;}
.tsc-item .tsv{font-size:19px;font-weight:900;color:var(--purple);}
.tact{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;}
.tbtn{padding:7px 16px;border:2px solid #EDE0F5;border-radius:30px;background:#FAFAFA;color:var(--muted);font-size:12px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .15s;}
.tbtn:hover{border-color:var(--pink);color:var(--pink);}
/* TALES */
.tales-wrap{width:100%;max-width:440px;}
.tchar{display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:10px;}
.tchar-name{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px;}
.tq{font-size:16px;font-weight:800;text-align:center;margin-bottom:12px;line-height:1.4;}
.topts{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;}
.topt{padding:12px 8px;border:2.5px solid #EDE0F5;border-radius:14px;background:#FAFAFA;color:var(--text);font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .18s;text-align:center;line-height:1.3;}
.topt:hover:not(:disabled){border-color:#FFD93D;transform:translateY(-2px);background:#FFFDE7;}
.topt.ok{background:#E8F5E9;border-color:#43A047;color:#1B5E20;}
.topt.no{background:#FFEBEE;border-color:#E53935;color:#7F0000;}
.topt:disabled{cursor:default;}
.tstreak{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px;text-align:center;}
.thint{font-size:12px;color:var(--muted);text-align:center;margin-top:7px;font-style:italic;min-height:16px;}
/* PSANI */
.pw{display:flex;flex-direction:column;align-items:center;gap:9px;width:100%;}
.pmodes{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;}
.pmbtn{padding:7px 15px;border:2px solid #EDE0F5;border-radius:30px;background:#FAFAFA;color:var(--muted);font-size:12px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .15s;}
.pmbtn.on{background:linear-gradient(135deg,#26C6DA,#6BCB77);border-color:transparent;color:#fff;}
.ptarget{font-family:'Fredoka One',cursive;font-size:90px;line-height:1;background:linear-gradient(135deg,#26C6DA,#6BCB77);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:2px 0;}
.ptip{font-size:12px;color:var(--muted);text-align:center;}
.psc{font-size:12px;color:var(--muted);font-weight:700;}
.canvaswrap{position:relative;width:100%;max-width:330px;}
.canvaswrap canvas{display:block;border-radius:16px;border:3px dashed #26C6DA;background:#f0fffe;touch-action:none;cursor:crosshair;}
.guidetxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:'Fredoka One',cursive;font-size:100px;color:rgba(38,198,218,.09);line-height:1;user-select:none;}
.ptools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;}
.pcol{width:24px;height:24px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .15s;}
.pcol:hover{transform:scale(1.2);}
.pcol.on{border-color:#333;}
.psz{width:30px;height:30px;border-radius:50%;border:2px solid #EDE0F5;background:#FAFAFA;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.psz.on{border-color:#26C6DA;background:#e0f7fa;}
.pcheck{background:linear-gradient(135deg,#26C6DA,#6BCB77);color:#fff;border:none;border-radius:40px;padding:11px 28px;font-size:15px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;transition:transform .15s;box-shadow:0 4px 15px rgba(38,198,218,.35);}
.pcheck:hover{transform:scale(1.05);}
.pres{font-size:16px;font-weight:800;text-align:center;}
.pres.ok{color:#43A047;}
.pres.no{color:#E53935;}
.ptool2{padding:6px 14px;border:2px solid #EDE0F5;border-radius:30px;background:#FAFAFA;color:var(--muted);font-size:12px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;}
/* Spotify */
.spwrap{position:fixed;bottom:14px;right:14px;z-index:999;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.sptoggle{background:linear-gradient(135deg,#1DB954,#1aa34a);color:white;border:none;border-radius:30px;padding:9px 16px;font-size:12px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;box-shadow:0 4px 20px rgba(29,185,84,.45);display:flex;align-items:center;gap:7px;transition:transform .15s;}
.sptoggle:hover{transform:scale(1.05);}
.spembed{border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.5);transition:all .3s;transform-origin:bottom right;}
.spembed.hide{transform:scale(.8);opacity:0;pointer-events:none;height:0;}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="stage-bar"></div>
<header>
  <div class="logo">🎤 K-pop Academy✦</div>
  <div class="pills">
    <div class="pill">⭐ <span id="sc">0</span></div>
    <div class="pill">✅ <span id="co">0</span></div>
  </div>
</header>
<nav>
  <button class="nb on c1" onclick="go('abc')">🔤 Abeceda</button>
  <button class="nb c2" onclick="go('math')">🔢 Počítání</button>
  <button class="nb c3" onclick="go('mem')">🧩 Paměť</button>
  <button class="nb c4" onclick="go('col')">🎨 Barvy</button>
  <button class="nb c5" onclick="go('ani')">🐾 Zvířata</button>
  <button class="nb c6" onclick="go('sim')">🎵 Rytmus</button>
  <button class="nb c7" onclick="go('wld')">🌍 Svět</button>
  <button class="nb c8" onclick="go('ttt')">💜 Piškvorky</button>
  <button class="nb c9" onclick="go('tal')">🧚 Pohádky</button>
  <button class="nb c10" onclick="go('wri')">✏️ Psaní</button>
</nav>
<main>
  <div class="card c1" id="card">
    <div id="gc" style="width:100%;display:flex;flex-direction:column;align-items:center;"></div>
  </div>
  <div class="fb" id="fb" style="color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);margin-top:10px;"></div>
  <div style="display:flex;justify-content:center;margin-top:11px;" id="nr"></div>
</main>
<div class="spwrap">
  <div class="spembed hide" id="spe">
    <iframe src="https://open.spotify.com/embed/album/14JkAa6IiFaOh5s0nMyMU9?utm_source=generator&theme=0" width="290" height="152" frameborder="0" allow="autoplay;clipboard-write;encrypted-media;fullscreen;picture-in-picture" loading="lazy" style="border-radius:16px;"></iframe>
  </div>
  <button class="sptoggle" onclick="toggleSp()">🎵 <span id="sptxt">K-pop Demon Hunters ♪</span></button>
</div>
<script>
// ── BG ──
(function(){
  var bg=document.getElementById('bg');
  var items=['🎤','🎵','⭐','💜','🌸','✨','🎀','💫','🎶','🌟'];
  for(var i=0;i<16;i++){
    var d=document.createElement('div');
    d.className='floatie';
    d.textContent=items[Math.floor(Math.random()*items.length)];
    d.style.cssText='left:'+Math.random()*100+'%;bottom:-40px;font-size:'+(14+Math.random()*16)+'px;animation-duration:'+(9+Math.random()*13)+'s;animation-delay:'+(-Math.random()*14)+'s;position:absolute;';
    bg.appendChild(d);
  }
})();

// ── SPOTIFY ──
var spOpen=false;
function toggleSp(){
  spOpen=!spOpen;
  var el=document.getElementById('spe');
  var tx=document.getElementById('sptxt');
  if(spOpen){el.classList.remove('hide');tx.textContent='Schovat ✕';}
  else{el.classList.add('hide');tx.textContent='K-pop Demon Hunters ♪';}
}

// ── HELPERS ──
var score=0,corr=0,mode='abc',answered=false;
function ust(){document.getElementById('sc').textContent=score;document.getElementById('co').textContent=corr;}
function sfb(ok,msg){var f=document.getElementById('fb');f.textContent=msg;f.className='fb '+(ok?'ok':'no');}
function cfb(){document.getElementById('fb').textContent='';}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function shu(a){return a.slice().sort(function(){return Math.random()-.5;});}
function shownxt(fn){
  var r=document.getElementById('nr');r.innerHTML='';
  var b=document.createElement('button');b.className='nxt';b.textContent='Další ➤';
  b.onclick=fn;r.appendChild(b);
}
function clrnr(){document.getElementById('nr').innerHTML='';}
function go(m){
  mode=m;
  document.querySelectorAll('.nb').forEach(function(b,i){
    var ms=['abc','math','mem','col','ani','sim','wld','ttt','tal','wri'];
    b.classList.toggle('on',ms[i]===m);
  });
  var cls={abc:'c1',math:'c2',mem:'c3',col:'c4',ani:'c5',sim:'c6',wld:'c7',ttt:'c8',tal:'c9',wri:'c10'};
  document.getElementById('card').className='card '+(cls[m]||'c1');
  cfb();clrnr();answered=false;
  dispatch();
}
function dispatch(){
  if(mode==='abc')abcNext();
  else if(mode==='math')mathNext();
  else if(mode==='mem')memNext();
  else if(mode==='col')colNext();
  else if(mode==='ani')aniNext();
  else if(mode==='sim')simNext();
  else if(mode==='wld')wldNext();
  else if(mode==='ttt')tttPick();
  else if(mode==='tal')talNext();
  else if(mode==='wri')wriNext();
}

// ── SVG POSTAVIČKY ──
function gA(sz){

function tttWinner(b){for(var i=0;i<WL.length;i++){var l=WL[i];if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]])return b[l[0]];}return b.every(function(c){return c;})?'draw':null;}
function minimax(b,isMax,d,al,be){var r=tttWinner(b);if(r==='B')return 10-d;if(r==='A')return d-10;if(r==='draw')return 0;var em=b.reduce(function(a,v,i){if(v===null)a.push(i);return a;},[]);if(isMax){var best=-Infinity;for(var i=0;i<em.length;i++){b[em[i]]='B';var v=minimax(b,false,d+1,al,be);b[em[i]]=null;if(v>best)best=v;if(v>al)al=v;if(be<=al)break;}return best;}else{var best2=Infinity;for(var j=0;j<em.length;j++){b[em[j]]='A';var v2=minimax(b,true,d+1,al,be);b[em[j]]=null;if(v2<best2)best2=v2;if(v2<be)be=v2;if(be<=al)break;}return best2;}}
