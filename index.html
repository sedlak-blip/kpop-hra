<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-pop Academy ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root{--pink:#FF6B9D;--purple:#9B59B6;--yellow:#FFD93D;--mint:#6BCB77;--blue:#4D96FF;--orange:#FF9A3C;--bg:#1a0a2e;--card:rgba(255,255,255,0.97);--text:#2D1B4E;--muted:#8B7BA8;--radius:20px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
.bg-scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.bg-gradient{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 30%,#3d0066 0%,transparent 55%),radial-gradient(ellipse at 80% 70%,#1a0050 0%,transparent 55%),linear-gradient(160deg,#0d0020 0%,#1a0035 40%,#0a001a 100%);}
.spotlight{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.18;animation:spotmove 8s ease-in-out infinite alternate;}
.spotlight.sp1{width:400px;height:400px;background:#ff6b9d;top:-100px;left:-100px;animation-delay:0s;}
.spotlight.sp2{width:350px;height:350px;background:#9b59b6;top:40%;right:-80px;animation-delay:-3s;}
.spotlight.sp3{width:300px;height:300px;background:#4d96ff;bottom:-80px;left:30%;animation-delay:-6s;}
@keyframes spotmove{0%{transform:translate(0,0) scale(1);}100%{transform:translate(40px,30px) scale(1.15);}}
.floatie{position:absolute;font-size:22px;opacity:0;animation:floatup linear infinite;}
@keyframes floatup{0%{opacity:0;transform:translateY(0) rotate(0deg);}10%{opacity:0.7;}80%{opacity:0.5;}100%{opacity:0;transform:translateY(-110vh) rotate(360deg);}}
.stage-light{position:absolute;bottom:0;width:3px;height:45vh;transform-origin:bottom center;opacity:0.12;animation:sway 4s ease-in-out infinite alternate;}
@keyframes sway{0%{transform:rotate(-12deg);}100%{transform:rotate(12deg);}}
.stage-bar{position:fixed;bottom:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#ff6b9d,#9b59b6,#4d96ff,#ff6b9d);background-size:200% 100%;animation:barscroll 3s linear infinite;z-index:1;}
@keyframes barscroll{0%{background-position:0% 0;}100%{background-position:200% 0;}}
.app-header{position:sticky;top:0;z-index:100;background:rgba(26,10,46,0.92);backdrop-filter:blur(12px);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,107,157,0.3);}
.app-title{font-family:'Fredoka One',cursive;color:#fff;font-size:22px;text-shadow:0 0 20px rgba(255,107,157,0.6);}
.app-title .dot{color:var(--yellow);}
.stats-row{display:flex;gap:10px;}
.stat-pill{background:rgba(255,255,255,0.1);color:#fff;border-radius:30px;padding:5px 14px;font-size:14px;font-weight:700;border:1px solid rgba(255,107,157,0.3);}
.game-nav{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 8px;scrollbar-width:none;position:relative;z-index:10;}
.game-nav::-webkit-scrollbar{display:none;}
.nav-btn{flex-shrink:0;background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.15);border-radius:40px;padding:8px 16px;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;color:rgba(255,255,255,0.7);transition:all 0.2s;display:flex;align-items:center;gap:5px;}
.nav-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,0.15);}
.nav-btn.active{color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(0,0,0,0.3);}
.nav-btn.active.c1{background:linear-gradient(135deg,#FF6B9D,#e91e8c);}
.nav-btn.active.c2{background:linear-gradient(135deg,#4D96FF,#2979FF);}
.nav-btn.active.c3{background:linear-gradient(135deg,#6BCB77,#43A047);}
.nav-btn.active.c4{background:linear-gradient(135deg,#FFD93D,#FB8C00);}
.nav-btn.active.c5{background:linear-gradient(135deg,#9B59B6,#6A1B9A);}
.nav-btn.active.c6{background:linear-gradient(135deg,#FF9A3C,#E64A19);}
.nav-btn.active.c7{background:linear-gradient(135deg,#26C6DA,#0097A7);}
.nav-btn.active.c8{background:linear-gradient(135deg,#FF6B9D,#9B59B6);}
.nav-btn.active.c9{background:linear-gradient(135deg,#FFD93D,#FF9A3C);}
.nav-btn.active.c10{background:linear-gradient(135deg,#26C6DA,#6BCB77);}
.main{padding:12px 20px 80px;max-width:700px;margin:0 auto;position:relative;z-index:10;}
.game-card{background:rgba(255,255,255,0.96);border-radius:var(--radius);padding:22px;box-shadow:0 8px 40px rgba(0,0,0,0.4),0 0 0 1px rgba(255,107,157,0.2);min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;backdrop-filter:blur(4px);}
.game-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;}
.game-card.c1::before{background:linear-gradient(90deg,#FF6B9D,#e91e8c);}
.game-card.c2::before{background:linear-gradient(90deg,#4D96FF,#2979FF);}
.game-card.c3::before{background:linear-gradient(90deg,#6BCB77,#43A047);}
.game-card.c4::before{background:linear-gradient(90deg,#FFD93D,#FB8C00);}
.game-card.c5::before{background:linear-gradient(90deg,#9B59B6,#6A1B9A);}
.game-card.c6::before{background:linear-gradient(90deg,#FF9A3C,#E64A19);}
.game-card.c7::before{background:linear-gradient(90deg,#26C6DA,#0097A7);}
.game-card.c8::before{background:linear-gradient(90deg,#FF6B9D,#9B59B6);}
.game-card.c9::before{background:linear-gradient(90deg,#FFD93D,#FF9A3C);}
.game-card.c10::before{background:linear-gradient(90deg,#26C6DA,#6BCB77);}
.game-label{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.big-letter{font-family:'Fredoka One',cursive;font-size:90px;line-height:1;background:linear-gradient(135deg,#FF6B9D,#9B59B6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:6px 0;}
.question{font-size:19px;font-weight:800;text-align:center;margin-bottom:14px;}
.sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:14px;}
.opts-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px;}
.opt{padding:13px 8px;border:2.5px solid #EDE0F5;border-radius:14px;background:#FAFAFA;color:var(--text);font-size:15px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all 0.18s;text-align:center;}
.opt:hover:not(:disabled){border-color:var(--pink);transform:translateY(-2px);background:#FFF0F8;}
.opt.correct{background:#E8F5E9;border-color:#43A047;color:#1B5E20;}
.opt.wrong{background:#FFEBEE;border-color:#E53935;color:#7F0000;}
.opt:disabled{cursor:default;}
.opt-emoji{font-size:28px;display:block;margin-bottom:4px;}
.opt-text{font-size:12px;}
.feedback{margin-top:12px;font-size:17px;font-weight:800;text-align:center;min-height:26px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.5);}
.feedback.ok{color:#6BCB77;}
.feedback.no{color:#FF6B9D;}
.next-btn{margin-top:14px;background:linear-gradient(135deg,#FF6B9D,#9B59B6);color:#fff;border:none;border-radius:40px;padding:11px 30px;font-size:15px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;transition:transform 0.15s;box-shadow:0 4px 15px rgba(155,89,182,0.4);}
.next-btn:hover{transform:scale(1.05);}
.word-display{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0;}
.wchar{width:40px;height:50px;border-bottom:4px solid #9B59B6;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;font-family:'Fredoka One',cursive;}
.wchar.blank{color:var(--pink);border-bottom-color:var(--pink);}
.letter-pool{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
.lbtn{width:48px;height:48px;border:2.5px solid #EDE0F5;border-radius:12px;background:#FAFAFA;color:var(--text);font-size:21px;font-weight:800;font-family:'Fredoka One',cursive;cursor:pointer;transition:all 0.15s;}
.lbtn:hover:not(:disabled){border-color:var(--pink);background:#FFF0F8;}
.lbtn.correct{background:#E8F5E9;border-color:#43A047;color:#1B5E20;}
.lbtn.wrong{background:#FFEBEE;border-color:#E53935;color:#7F0000;}
.slots-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 14px;}
.slot{width:42px;height:50px;border-bottom:4px solid var(--pink);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--text);font-family:'Fredoka One',cursive;}
.slot.filled{background:#FFF0F8;border-radius:8px 8px 0 0;}
.syl-pool{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.sbtn{padding:9px 14px;border:2.5px solid #EDE0F5;border-radius:12px;background:#FAFAFA;color:var(--text);font-size:19px;font-weight:800;font-family:'Fredoka One',cursive;cursor:pointer;transition:all 0.15s;}
.sbtn:hover:not(.used){border-color:var(--pink);background:#FFF0F8;transform:translateY(-2px);}
.sbtn.used{opacity:0.3;pointer-events:none;}
.math-eq{font-family:'Fredoka One',cursive;font-size:52px;text-align:center;margin:10px 0;color:var(--purple);}
.math-eq .qm{color:var(--pink);}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:100%;max-width:360px;}
.mem-card{aspect-ratio:1;border-radius:12px;border:2.5px solid #EDE0F5;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;position:relative;transform-style:preserve-3d;}
.mem-card .mfront,.mem-card .mback{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;transition:transform 0.4s;}
.mem-card .mfront{background:linear-gradient(135deg,#9B59B6,#6A1B9A);font-size:22px;color:rgba(255,255,255,0.3);}
.mem-card .mback{background:#fff;font-size:30px;transform:rotateY(180deg);border:2px solid #EDE0F5;}
.mem-card.flipped .mfront{transform:rotateY(180deg);}
.mem-card.flipped .mback{transform:rotateY(0deg);}
.mem-card.matched{opacity:0.45;pointer-events:none;}
.shape-display{margin:10px 0;}
.color-opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
.color-btn{width:56px;height:56px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform 0.15s;}
.color-btn:hover{transform:scale(1.15);}
.color-btn.correct{border-color:#43A047;box-shadow:0 0 0 4px #A5D6A7;}
.color-btn.wrong{border-color:#E53935;box-shadow:0 0 0 4px #FFCDD2;}
.simon-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:200px;height:200px;}
.simon-btn{border-radius:50%;border:none;cursor:pointer;transition:filter 0.15s,transform 0.1s;filter:brightness(0.7);}
.simon-btn.s0{background:#E53935;}.simon-btn.s1{background:#43A047;}
.simon-btn.s2{background:#FFD600;}.simon-btn.s3{background:#4D96FF;}
.simon-btn.lit{filter:brightness(1.5);transform:scale(1.08);}
.simon-info{font-size:14px;font-weight:700;color:var(--muted);margin-top:10px;text-align:center;}
.animal-big{font-size:72px;margin:6px 0;}
.animal-name{font-size:20px;font-weight:800;color:var(--purple);margin-bottom:10px;}

/* ══ PIŠKVORKY ══ */
.ttt-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;}

/* MODE PICKER */
.ttt-mode-pick{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0;}
.ttt-mode-pick h3{font-size:17px;font-weight:800;color:var(--text);}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px;}
.mode-card{border:2.5px solid #EDE0F5;border-radius:16px;padding:16px 10px;background:#FAFAFA;cursor:pointer;text-align:center;transition:all 0.18s;display:flex;flex-direction:column;align-items:center;gap:6px;}
.mode-card:hover{border-color:var(--pink);background:#FFF0F8;transform:translateY(-3px);}
.mode-card .mc-icon{font-size:36px;}
.mode-card .mc-title{font-size:14px;font-weight:800;color:var(--text);}
.mode-card .mc-sub{font-size:11px;color:var(--muted);}

/* DIFFICULTY */
.diff-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.diff-btn{padding:8px 18px;border:2px solid #EDE0F5;border-radius:30px;background:#FAFAFA;color:var(--muted);font-size:13px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;transition:all 0.15s;}
.diff-btn:hover{border-color:var(--purple);color:var(--purple);}
.diff-btn.active{border-color:var(--purple);background:var(--purple);color:#fff;}

/* TURN INDICATOR */
.turn-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 16px;border-radius:30px;font-size:14px;font-weight:800;width:100%;max-width:320px;}
.turn-bar.tA{background:#FFF0F8;color:#e91e8c;border:2px solid #FFB3C6;}
.turn-bar.tB{background:#F3E5FF;color:#7B1FA2;border:2px solid #CE93D8;}
.turn-bar.thinking{background:#EEF4FF;color:#1565C0;border:2px solid #90CAF9;animation:pulse 0.8s ease-in-out infinite alternate;}
@keyframes pulse{0%{opacity:0.7;}100%{opacity:1;}}

/* BOARD */
.ttt-board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:290px;}
.ttt-cell{aspect-ratio:1;border:2.5px solid #EDE0F5;border-radius:14px;background:#FAFAFA;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s,transform 0.15s;}
.ttt-cell:hover:not(.taken):not(.blocked){background:#FFF0F8;border-color:var(--pink);transform:scale(1.05);}
.ttt-cell.taken,.ttt-cell.blocked{cursor:default;}
.ttt-cell.win-cell{background:linear-gradient(135deg,#FFF0F8,#F3E5FF);border-color:var(--pink);animation:wincell 0.5s ease;}
@keyframes wincell{0%{transform:scale(0.9);}60%{transform:scale(1.08);}100%{transform:scale(1);}}
.ttt-cell.place-anim{animation:placeIn 0.25s ease;}
@keyframes placeIn{0%{transform:scale(0.5);opacity:0.5;}100%{transform:scale(1);opacity:1;}}

/* SCORE */
.ttt-scorebar{display:flex;gap:8px;justify-content:center;width:100%;max-width:320px;}
.ttt-sc{flex:1;text-align:center;background:#F8F0FF;border-radius:12px;padding:7px 6px;}
.ttt-sc .lbl{font-size:10px;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;}
.ttt-sc .val{font-size:20px;font-weight:900;color:var(--purple);}

/* ACTION BTNS */
.ttt-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.ttt-btn{padding:8px 18px;border:2px solid #EDE0F5;border-radius:30px;background:#FAFAFA;color:var(--muted);font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all 0.15s;}
.ttt-btn:hover{border-color:var(--pink);color:var(--pink);}
.ttt-btn.primary{background:linear-gradient(135deg,#FF6B9D,#9B59B6);border-color:transparent;color:#fff;}
.ttt-btn.primary:hover{transform:scale(1.04);}

@media(max-width:480px){.big-letter{font-size:68px;}.math-eq{font-size:38px;}.memory-grid{gap:5px;}.simon-grid{width:170px;height:170px;}.ttt-board{max-width:250px;}.mode-cards{grid-template-columns:1fr 1fr;}}

/* tales */
.tales-card{width:100%;max-width:460px;}
.tales-char{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:12px;}
.tales-char-name{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px;}
.tales-question{font-size:17px;font-weight:800;color:var(--text);text-align:center;margin-bottom:14px;line-height:1.4;}
.tales-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;}
.tales-opt{padding:13px 8px;border:2.5px solid #EDE0F5;border-radius:14px;background:#FAFAFA;color:var(--text);font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all 0.18s;text-align:center;line-height:1.3;}
.tales-opt:hover:not(:disabled){border-color:#FFD93D;transform:translateY(-2px);background:#FFFDE7;}
.tales-opt.correct{background:#E8F5E9;border-color:#43A047;color:#1B5E20;}
.tales-opt.wrong{background:#FFEBEE;border-color:#E53935;color:#7F0000;}
.tales-opt:disabled{cursor:default;}
.tales-streak{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px;text-align:center;}
.tales-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;font-style:italic;min-height:18px;}


/* ══ PSANÍ ══ */
.write-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;}
.write-target{font-family:'Fredoka One',cursive;font-size:100px;line-height:1;background:linear-gradient(135deg,#26C6DA,#6BCB77);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:2px 0;user-select:none;}
.write-label{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.write-sublabel{font-size:13px;color:var(--muted);text-align:center;}
.canvas-wrap{position:relative;border:3px dashed #26C6DA;border-radius:18px;background:#f8fffe;touch-action:none;overflow:hidden;cursor:crosshair;}
canvas.draw-canvas{display:block;}
.canvas-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;}
.tool-btn{padding:7px 16px;border:2px solid #EDE0F5;border-radius:30px;background:#FAFAFA;color:var(--muted);font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all 0.15s;}
.tool-btn:hover{border-color:#26C6DA;color:#26C6DA;}
.tool-btn.active{background:#26C6DA;border-color:#26C6DA;color:white;}
.color-row{display:flex;gap:6px;align-items:center;}
.pen-color{width:26px;height:26px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform 0.15s;}
.pen-color:hover{transform:scale(1.2);}
.pen-color.active{border-color:#333;}
.size-row{display:flex;gap:6px;align-items:center;}
.size-btn{width:34px;height:34px;border-radius:50%;border:2px solid #EDE0F5;background:#FAFAFA;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.size-btn:hover{border-color:#26C6DA;}
.size-btn.active{border-color:#26C6DA;background:#e0f7fa;}
.write-check-btn{background:linear-gradient(135deg,#26C6DA,#6BCB77);color:white;border:none;border-radius:40px;padding:12px 32px;font-size:16px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;transition:transform 0.15s;box-shadow:0 4px 15px rgba(38,198,218,0.35);}
.write-check-btn:hover{transform:scale(1.05);}
.write-result{font-size:18px;font-weight:800;text-align:center;margin-top:4px;}
.write-result.ok{color:#43A047;}
.write-result.no{color:#E53935;}
.write-mode-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px;}
.wm-btn{padding:7px 16px;border:2px solid #EDE0F5;border-radius:30px;background:#FAFAFA;color:var(--muted);font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all 0.15s;}
.wm-btn.active{background:linear-gradient(135deg,#26C6DA,#6BCB77);border-color:transparent;color:white;}
.write-progress{font-size:12px;color:var(--muted);font-weight:700;}
.guide-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.guide-char{font-family:'Fredoka One',cursive;font-size:120px;color:rgba(38,198,218,0.1);user-select:none;line-height:1;}


/* ══ SPOTIFY PLAYER ══ */
.spotify-player{
  position:fixed;bottom:14px;right:14px;z-index:999;
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;
}
.spotify-toggle{
  background:linear-gradient(135deg,#1DB954,#1aa34a);
  color:white;border:none;border-radius:30px;
  padding:10px 18px;font-size:13px;font-weight:800;
  font-family:'Nunito',sans-serif;cursor:pointer;
  box-shadow:0 4px 20px rgba(29,185,84,0.45);
  display:flex;align-items:center;gap:8px;
  transition:transform 0.15s;
  white-space:nowrap;
}
.spotify-toggle:hover{transform:scale(1.05);}
.spotify-toggle .note{animation:notebounce 0.8s ease-in-out infinite alternate;}
@keyframes notebounce{0%{transform:translateY(0);}100%{transform:translateY(-3px);}}
.spotify-embed{
  border-radius:16px;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
  transition:all 0.3s ease;
  transform-origin:bottom right;
}
.spotify-embed.hidden{
  transform:scale(0.8);opacity:0;pointer-events:none;height:0;
}
.spotify-embed.visible{
  transform:scale(1);opacity:1;
}

</style>
</head>
<body>

<div class="bg-scene">
  <div class="bg-gradient"></div>
  <div class="spotlight sp1"></div>
  <div class="spotlight sp2"></div>
  <div class="spotlight sp3"></div>
  <div id="floaties"></div>
  <div id="stagelights"></div>
</div>
<div class="stage-bar"></div>

<header class="app-header">
  <div class="app-title" style="display:flex;align-items:center;gap:8px;"><span style="display:inline-flex;align-items:center;gap:2px;" id="header-girls"></span><span>K-pop Academy<span class="dot">✦</span></span></div>
  <div class="stats-row">
    <div class="stat-pill">⭐ <span id="score">0</span></div>
    <div class="stat-pill">✅ <span id="correct">0</span></div>
  </div>
</header>

<nav class="game-nav">
  <button class="nav-btn active c1" onclick="setMode('abc')">🔤 Abeceda</button>
  <button class="nav-btn c2" onclick="setMode('math')">🔢 Počítání</button>
  <button class="nav-btn c3" onclick="setMode('memory')">🧩 Paměť</button>
  <button class="nav-btn c4" onclick="setMode('colors')">🎨 Barvy</button>
  <button class="nav-btn c5" onclick="setMode('animals')">🐾 Zvířata</button>
  <button class="nav-btn c6" onclick="setMode('simon')">🎵 Rytmus</button>
  <button class="nav-btn c7" onclick="setMode('world')">🌍 Svět</button>
  <button class="nav-btn c8" onclick="setMode('ttt')">💜 Piškvorky</button>
  <button class="nav-btn c9" onclick="setMode('tales')">🧚 Pohádky</button>
  <button class="nav-btn c10" onclick="setMode('write')">✏️ Psaní</button>
</nav>

<main class="main">
  <div class="game-card c1" id="game-card">
    <div id="game-content" style="width:100%;display:flex;flex-direction:column;align-items:center;"></div>
  </div>
  <div class="feedback" id="feedback"></div>
  <div style="display:flex;justify-content:center;margin-top:12px" id="nav-row"></div>
</main>

<script>
// ══ BACKGROUND ══
(function(){
  const items=['🎤','🎵','⭐','💜','🌸','✨','🎀','💫','🎶','🌟'];
  const fc=document.getElementById('floaties');
  for(let i=0;i<18;i++){
    const d=document.createElement('div');d.className='floatie';
    d.textContent=items[Math.floor(Math.random()*items.length)];
    d.style.left=Math.random()*100+'%';d.style.bottom='-40px';
    d.style.fontSize=(16+Math.random()*18)+'px';
    d.style.animationDuration=(8+Math.random()*14)+'s';
    d.style.animationDelay=(-Math.random()*15)+'s';
    fc.appendChild(d);
  }
  const slc=document.getElementById('stagelights');
  const cols=['#ff6b9d','#9b59b6','#4d96ff','#ffd93d','#ff9a3c','#6bcb77'];
  for(let i=0;i<8;i++){
    const d=document.createElement('div');d.className='stage-light';
    d.style.left=(8+i*12)+'%';d.style.background=cols[i%cols.length];
    d.style.animationDuration=(3+Math.random()*3)+'s';
    d.style.animationDelay=(-Math.random()*4)+'s';
    slc.appendChild(d);
  }
})();

// ══ SVG CHARACTERS ══
function girlA(sz){sz=sz||52;return`<svg width="${sz}" height="${sz}" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg"><ellipse cx="28" cy="22" rx="14" ry="16" fill="#FF6B9D"/><ellipse cx="13" cy="20" rx="5" ry="9" fill="#FF6B9D" transform="rotate(-15,13,20)"/><ellipse cx="43" cy="20" rx="5" ry="9" fill="#FF6B9D" transform="rotate(15,43,20)"/><ellipse cx="28" cy="23" rx="11" ry="12" fill="#FFE0CC"/><ellipse cx="28" cy="13" rx="11" ry="5" fill="#FF6B9D"/><ellipse cx="23" cy="23" rx="2.5" ry="3" fill="#2D1B4E"/><ellipse cx="33" cy="23" rx="2.5" ry="3" fill="#2D1B4E"/><circle cx="24" cy="22" r="1" fill="white"/><circle cx="34" cy="22" r="1" fill="white"/><ellipse cx="19" cy="27" rx="3" ry="2" fill="#FFB3C6" opacity="0.6"/><ellipse cx="37" cy="27" rx="3" ry="2" fill="#FFB3C6" opacity="0.6"/><path d="M24 29 Q28 33 32 29" stroke="#e91e8c" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M17 48 Q17 36 28 36 Q39 36 39 48Z" fill="#FF6B9D"/><text x="28" y="46" text-anchor="middle" font-size="9" fill="white">★</text><rect x="38" y="30" width="4" height="8" rx="2" fill="#9B59B6"/><circle cx="40" cy="29" r="3" fill="#C39BD3"/></svg>`;}
function girlB(sz){sz=sz||52;return`<svg width="${sz}" height="${sz}" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg"><path d="M14 22 Q14 8 28 8 Q42 8 42 22" stroke="#4D96FF" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="13" cy="23" rx="5" ry="6" fill="#4D96FF"/><ellipse cx="43" cy="23" rx="5" ry="6" fill="#4D96FF"/><ellipse cx="28" cy="22" rx="13" ry="15" fill="#9B59B6"/><ellipse cx="28" cy="24" rx="10" ry="11" fill="#FFE0CC"/><path d="M18 16 Q22 11 28 14 Q34 11 38 16" fill="#9B59B6"/><ellipse cx="23" cy="24" rx="2.5" ry="3" fill="#2D1B4E"/><path d="M30 23 Q33 21 36 23" stroke="#2D1B4E" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="24" cy="23" r="1" fill="white"/><ellipse cx="19" cy="28" rx="3" ry="2" fill="#FFB3C6" opacity="0.5"/><ellipse cx="37" cy="28" rx="3" ry="2" fill="#FFB3C6" opacity="0.5"/><path d="M24 30 Q28 35 32 30" stroke="#9B59B6" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M18 48 Q18 37 28 37 Q38 37 38 48Z" fill="#9B59B6"/><text x="28" y="46" text-anchor="middle" font-size="9" fill="white">♪</text></svg>`;}

// ══ STATE ══
let score=0,correct=0,mode='abc',answered=false;
function updStats(){document.getElementById('score').textContent=score;document.getElementById('correct').textContent=correct;}
function setFeedback(ok,msg){const f=document.getElementById('feedback');f.textContent=msg;f.className='feedback '+(ok?'ok':'no');}
function clearFeedback(){document.getElementById('feedback').textContent='';}
function rand(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){return[...arr].sort(()=>Math.random()-0.5);}
function showNext(fn){const row=document.getElementById('nav-row');row.innerHTML='';const b=document.createElement('button');b.className='next-btn';b.textContent='Další ➤';b.onclick=fn;row.appendChild(b);}
function clearNav(){document.getElementById('nav-row').innerHTML='';}
function setMode(m){
  mode=m;
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{
    const ms=['abc','math','memory','colors','animals','simon','world','ttt','tales','write'];
    b.classList.toggle('active',ms[i]===m);
  });
  const cls={abc:'c1',math:'c2',memory:'c3',colors:'c4',animals:'c5',simon:'c6',world:'c7',ttt:'c8',tales:'c9',write:'c10'};
  document.getElementById('game-card').className='game-card '+(cls[m]||'c1');
  clearFeedback();clearNav();answered=false;dispatch();
}
function dispatch(){
  if(mode==='abc')// Init header postavičky
const hg = document.getElementById('header-girls');
if(hg){ hg.innerHTML = girlA(28) + girlB(28) + girlC(28); }
nextABC();else if(mode==='math')nextMath();else if(mode==='memory')nextMemory();
  else if(mode==='colors')nextColors();else if(mode==='animals')nextAnimals();
  else if(mode==='simon')nextSimon();else if(mode==='world')nextWorld();
  else if(mode==='ttt')showTTTPicker();else if(mode==='tales')nextTales();
}

// ══ ABC ══
const LETTERS=['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P','R','S','T','U','V','Z'];
const PIC=[{l:'A',e:'🚗',w:'auto'},{l:'B',e:'🍌',w:'banán'},{l:'C',e:'🍋',w:'citron'},{l:'D',e:'🌈',w:'duha'},{l:'E',e:'🐘',w:'slon'},{l:'F',e:'🍓',w:'jahoda'},{l:'G',e:'⚽',w:'gól'},{l:'H',e:'⭐',w:'hvězda'},{l:'I',e:'🦋',w:'motýl'},{l:'J',e:'🍎',w:'jablko'},{l:'K',e:'🐱',w:'kočka'},{l:'L',e:'🦁',w:'lev'},{l:'M',e:'🌙',w:'měsíc'},{l:'N',e:'✂️',w:'nůžky'},{l:'O',e:'🔥',w:'oheň'},{l:'P',e:'🐕',w:'pes'},{l:'R',e:'🌹',w:'růže'},{l:'S',e:'☀️',w:'slunce'},{l:'T',e:'🐯',w:'tygr'},{l:'U',e:'👂',w:'ucho'},{l:'V',e:'🐝',w:'včela'},{l:'Z',e:'🦊',w:'zvíře'}];
const WORDS_BUILD=[{w:'KOČKA',s:['K','O','Č','K','A']},{w:'AUTO',s:['A','U','T','O']},{w:'LES',s:['L','E','S']},{w:'DŮM',s:['D','Ů','M']},{w:'PES',s:['P','E','S']},{w:'MÍČ',s:['M','Í','Č']},{w:'NOS',s:['N','O','S']},{w:'KŮŇ',s:['K','Ů','Ň']}];
const MISSING_W=[{f:'KOČKA',d:['_','O','Č','K','A'],m:'K',h:'Mňau!'},{f:'AUTO',d:['A','U','_','O'],m:'T',h:'Jede po silnici'},{f:'LES',d:['L','_','S'],m:'E',h:'Plný stromů'},{f:'PES',d:['P','E','_'],m:'S',h:'Haf haf!'},{f:'MÍČ',d:['_','Í','Č'],m:'M',h:'Kopnem do něj'},{f:'DŮM',d:['_','Ů','M'],m:'D',h:'Bydlíme v něm'},{f:'NOS',d:['N','_','S'],m:'O',h:'Cítím jím!'},{f:'HVĚZDA',d:['H','V','_','Z','D','A'],m:'Ě',h:'Září na obloze'}];
function nextABC(){clearFeedback();clearNav();answered=false;const sub=Math.floor(Math.random()*4);const el=document.getElementById('game-content');if(sub===0)showRecognize(el);else if(sub===1)showPicture(el);else if(sub===2)showMissingL(el);else showBuild(el);}
function showRecognize(el){const letter=rand(LETTERS);const opts=shuffle([letter,...shuffle(LETTERS.filter(l=>l!==letter)).slice(0,3)]);el.innerHTML=`<div class="game-label">Jaké je toto písmeno?</div><div class="big-letter">${letter}</div><div class="opts-2" id="opts"></div>`;opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>pickOpt(o,letter,b,'opts',nextABC);el.querySelector('#opts').appendChild(b);});}
function showPicture(el){const item=rand(PIC);const wrongs=shuffle(PIC.filter(p=>p.l!==item.l)).slice(0,3);const opts=shuffle([item,...wrongs]);el.innerHTML=`<div class="game-label">Co začíná tímto písmenem?</div><div class="big-letter">${item.l}</div><div class="opts-2" id="opts"></div>`;opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="opt-emoji">${o.e}</span><span class="opt-text">${o.w}</span>`;b.onclick=()=>pickOpt(o.l,item.l,b,'opts',nextABC);el.querySelector('#opts').appendChild(b);});}
function showMissingL(el){const q=rand(MISSING_W);const opts=shuffle([q.m,...shuffle(LETTERS.filter(l=>l!==q.m)).slice(0,3)]);const disp=q.d.map(c=>c==='_'?`<div class="wchar blank">?</div>`:`<div class="wchar">${c}</div>`).join('');el.innerHTML=`<div class="game-label">Doplň chybějící písmeno</div><div class="word-display">${disp}</div><div class="sub">${q.h}</div><div class="letter-pool" id="lp"></div>`;opts.forEach(o=>{const b=document.createElement('button');b.className='lbtn';b.textContent=o;b.onclick=()=>{if(answered)return;answered=true;const ok=o===q.m;b.classList.add(ok?'correct':'wrong');el.querySelectorAll('.lbtn').forEach(x=>{if(x.textContent===q.m)x.classList.add('correct');x.disabled=true;});if(ok){score+=10;correct++;setFeedback(true,rand(['⭐ Skvělé!','🎉 Bravo!','✨ Perfekt!']));setTimeout(nextABC,1000);}else{setFeedback(false,`Správně: ${q.m}`);showNext(nextABC);}updStats();};el.querySelector('#lp').appendChild(b);});}
function showBuild(el){const q=rand(WORDS_BUILD);const sh=shuffle([...q.s]);let built=[];el.innerHTML=`<div class="game-label">Poskládej slovo</div><div class="slots-row" id="slots">${q.s.map((_,i)=>`<div class="slot" id="sl${i}"></div>`).join('')}</div><div class="syl-pool" id="sp"></div>`;sh.forEach(ch=>{const b=document.createElement('button');b.className='sbtn';b.textContent=ch;b.onclick=()=>{if(answered||b.classList.contains('used'))return;built.push(ch);b.classList.add('used');const sl=document.getElementById('sl'+(built.length-1));if(sl){sl.textContent=ch;sl.classList.add('filled');}if(built.length===q.s.length){const ok=built.join('')===q.w;answered=true;if(ok){score+=15;correct++;setFeedback(true,'🎉 '+q.w);setTimeout(nextABC,1100);}else{setFeedback(false,'Zkus znovu!');showNext(nextABC);}updStats();}};el.querySelector('#sp').appendChild(b);});}
function pickOpt(chosen,cv,btn,pid,next){if(answered)return;answered=true;const ok=chosen===cv;btn.classList.add(ok?'correct':'wrong');document.querySelectorAll('#'+pid+' .opt').forEach(b=>b.disabled=true);if(ok){score+=10;correct++;setFeedback(true,rand(['⭐ Skvělé!','🎉 Super!','✨ Wow!','🌟 Bravo!']));setTimeout(next,1000);}else{setFeedback(false,'Zkus znovu!');showNext(next);}updStats();}

// ══ MATH ══
function nextMath(){clearFeedback();clearNav();answered=false;const op=rand(['+','-']);let a,b,ans;if(op==='+'){a=Math.floor(Math.random()*10)+1;b=Math.floor(Math.random()*10)+1;ans=a+b;}else{a=Math.floor(Math.random()*10)+5;b=Math.floor(Math.random()*5)+1;ans=a-b;}const ws=new Set();while(ws.size<3){const w=ans+rand([-3,-2,-1,1,2,3]);if(w>=0&&w!==ans)ws.add(w);}const opts=shuffle([ans,...ws]);const el=document.getElementById('game-content');el.innerHTML=`<div class="game-label">Kolik je to?</div><div class="math-eq">${a} ${op} ${b} = <span class="qm">?</span></div><div class="opts-2" id="opts"></div>`;opts.forEach(o=>{const b2=document.createElement('button');b2.className='opt';b2.textContent=o;b2.onclick=()=>{if(answered)return;answered=true;const ok=o===ans;b2.classList.add(ok?'correct':'wrong');document.querySelectorAll('#opts .opt').forEach(x=>x.disabled=true);if(ok){score+=10;correct++;setFeedback(true,rand(['⭐ Správně!','🎉 Výborně!','✨ Skvělé!']));setTimeout(nextMath,1000);}else{setFeedback(false,`Správně: ${ans}`);showNext(nextMath);}updStats();};el.querySelector('#opts').appendChild(b2);});}

// ══ MEMORY ══
const MEM_PAIRS=['🎤','🌟','🎵','💜','🌸','🦋','🎀','🌈'];
let memCards=[],memFlipped=[],memMatched=0,memLock=false;
function nextMemory(){clearFeedback();clearNav();answered=false;memFlipped=[];memMatched=0;memLock=false;const pairs=shuffle([...MEM_PAIRS,...MEM_PAIRS]);memCards=pairs.map((e,i)=>({id:i,emoji:e,flipped:false,matched:false}));const el=document.getElementById('game-content');el.innerHTML=`<div class="game-label">Najdi stejné dvojice!</div><div class="memory-grid" id="mgrid"></div><div class="sub" style="margin-top:10px">Nalezeno: <b id="mfound">0</b> / ${MEM_PAIRS.length}</div>`;const grid=el.querySelector('#mgrid');memCards.forEach((_,i)=>{const d=document.createElement('div');d.className='mem-card';d.innerHTML=`<div class="mfront">✦</div><div class="mback">${memCards[i].emoji}</div>`;d.onclick=()=>flipCard(i);grid.appendChild(d);});}
function flipCard(i){if(memLock||memCards[i].flipped||memCards[i].matched)return;memCards[i].flipped=true;memFlipped.push(i);updateMemGrid();if(memFlipped.length===2){memLock=true;const[a,b]=memFlipped;if(memCards[a].emoji===memCards[b].emoji){setTimeout(()=>{memCards[a].matched=memCards[b].matched=true;memFlipped=[];memMatched++;memLock=false;score+=15;correct++;updStats();updateMemGrid();document.getElementById('mfound').textContent=memMatched;if(memMatched===MEM_PAIRS.length){setFeedback(true,'🎉 Výborně!');showNext(nextMemory);}},500);}else{setTimeout(()=>{memCards[a].flipped=memCards[b].flipped=false;memFlipped=[];memLock=false;updateMemGrid();},900);}}}
function updateMemGrid(){const grid=document.getElementById('mgrid');if(!grid)return;const cards=grid.querySelectorAll('.mem-card');memCards.forEach((card,i)=>{cards[i].className='mem-card'+(card.flipped||card.matched?' flipped':'')+(card.matched?' matched':'');});}

// ══ COLORS ══
const COLORS_DATA=[{name:'červená',hex:'#E53935'},{name:'modrá',hex:'#1E88E5'},{name:'zelená',hex:'#43A047'},{name:'žlutá',hex:'#FFD600'},{name:'oranžová',hex:'#FB8C00'},{name:'fialová',hex:'#8E24AA'},{name:'růžová',hex:'#E91E63'},{name:'hnědá',hex:'#795548'}];
const SHAPES=[{name:'kruh',svg:'<circle cx="60" cy="60" r="50"/>'},{name:'čtverec',svg:'<rect x="10" y="10" width="100" height="100" rx="6"/>'},{name:'trojúhelník',svg:'<polygon points="60,10 110,110 10,110"/>'},{name:'hvězda',svg:'<polygon points="60,10 72,42 105,42 80,62 89,95 60,75 31,95 40,62 15,42 48,42"/>'},{name:'srdce',svg:'<path d="M60,90 C60,90 15,60 15,35 C15,22 25,12 40,15 C50,17 60,25 60,25 C60,25 70,17 80,15 C95,12 105,22 105,35 C105,60 60,90 60,90Z"/>'}];
function nextColors(){clearFeedback();clearNav();answered=false;const shape=rand(SHAPES);const color=rand(COLORS_DATA);const wrongs=shuffle(COLORS_DATA.filter(c=>c.name!==color.name)).slice(0,3);const opts=shuffle([color,...wrongs]);const el=document.getElementById('game-content');el.innerHTML=`<div class="game-label">Jakou barvu má tento tvar?</div><div class="shape-display"><svg viewBox="0 0 120 120" width="110" height="110" style="display:block;margin:0 auto"><g fill="${color.hex}">${shape.svg}</g></svg></div><div class="sub">Je to ${shape.name}. Jaká je barva?</div><div class="color-opts" id="copts"></div>`;opts.forEach(o=>{const b=document.createElement('button');b.className='color-btn';b.style.background=o.hex;b.title=o.name;b.onclick=()=>{if(answered)return;answered=true;const ok=o.name===color.name;b.classList.add(ok?'correct':'wrong');document.querySelectorAll('.color-btn').forEach(x=>x.style.pointerEvents='none');if(ok){score+=10;correct++;setFeedback(true,'🎨 '+color.name+'!');setTimeout(nextColors,1000);}else{setFeedback(false,'Správně: '+color.name);showNext(nextColors);}updStats();};el.querySelector('#copts').appendChild(b);});}

// ══ ANIMALS ══
const ANIMALS=[{e:'🐱',n:'kočka',sound:'Mňau',lives:'doma',eats:'ryby'},{e:'🐕',n:'pes',sound:'Haf',lives:'doma',eats:'maso'},{e:'🐄',n:'kráva',sound:'Bú',lives:'na farmě',eats:'trávu'},{e:'🐸',n:'žába',sound:'Kvák',lives:'u rybníka',eats:'hmyz'},{e:'🦁',n:'lev',sound:'Rrr',lives:'v Africe',eats:'maso'},{e:'🐘',n:'slon',sound:'Troubí',lives:'v Africe',eats:'rostliny'},{e:'🐧',n:'tučňák',sound:'Kvák',lives:'v Antarktidě',eats:'ryby'},{e:'🦊',n:'liška',sound:'Štěká',lives:'v lese',eats:'vše'},{e:'🐴',n:'kůň',sound:'Iiíhá',lives:'na farmě',eats:'seno'},{e:'🐇',n:'králík',sound:'Tch',lives:'doma',eats:'zeleninu'}];
const ANI_QS=[(a,all)=>({q:`Jak dělá ${a.n}?`,ans:a.sound,opts:shuffle([a.sound,...shuffle(all.filter(x=>x.n!==a.n).map(x=>x.sound)).slice(0,3)])}),(a,all)=>({q:`Kde žije ${a.n}?`,ans:a.lives,opts:shuffle([a.lives,...shuffle(all.filter(x=>x.n!==a.n).map(x=>x.lives)).slice(0,3)])}),(a,all)=>({q:`Co jí ${a.n}?`,ans:a.eats,opts:shuffle([a.eats,...shuffle(all.filter(x=>x.n!==a.n).map(x=>x.eats)).slice(0,3)])})];
function nextAnimals(){clearFeedback();clearNav();answered=false;const animal=rand(ANIMALS);const{q,ans,opts}=rand(ANI_QS)(animal,ANIMALS);const el=document.getElementById('game-content');el.innerHTML=`<div class="game-label">Poznáváme zvířata</div><div class="animal-big">${animal.e}</div><div class="animal-name">${animal.n.charAt(0).toUpperCase()+animal.n.slice(1)}</div><div class="question">${q}</div><div class="opts-2" id="opts"></div>`;const seen=new Set();opts.filter(o=>{if(seen.has(o))return false;seen.add(o);return true;}).slice(0,4).forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>pickOpt(o,ans,b,'opts',nextAnimals);el.querySelector('#opts').appendChild(b);});}

// ══ SIMON ══
let simonSeq=[],simonPlayer=[],simonRound=0;
function nextSimon(){clearFeedback();clearNav();answered=false;simonSeq=[];simonPlayer=[];simonRound=0;const el=document.getElementById('game-content');el.innerHTML=`<div class="game-label">Opakuj sekvenci barev!</div><div class="simon-grid" id="sgrid"><button class="simon-btn s0" id="sb0"></button><button class="simon-btn s1" id="sb1"></button><button class="simon-btn s2" id="sb2"></button><button class="simon-btn s3" id="sb3"></button></div><div class="simon-info" id="sinfo">Připravit...</div>`;[0,1,2,3].forEach(i=>document.getElementById('sb'+i).onclick=()=>simonPress(i));setTimeout(simonAdd,900);}
function simonAdd(){simonSeq.push(Math.floor(Math.random()*4));simonPlayer=[];simonRound++;document.getElementById('sinfo').textContent=`Kolo ${simonRound} — sleduj!`;setSimonBtns(false);playSeq(0);}
function playSeq(i){if(i>=simonSeq.length){setSimonBtns(true);document.getElementById('sinfo').textContent='Teď ty!';return;}const btn=document.getElementById('sb'+simonSeq[i]);setTimeout(()=>{btn.classList.add('lit');setTimeout(()=>{btn.classList.remove('lit');playSeq(i+1);},500);},i*750);}
function setSimonBtns(on){[0,1,2,3].forEach(i=>{document.getElementById('sb'+i).style.pointerEvents=on?'auto':'none';});}

// ── MINIMAX ──
function checkWinner(board){
  for(const[a,b,c] of WIN_LINES){
    if(board[a]&&board[a]===board[b]&&board[a]===board[c])return board[a];
  }
  return board.every(c=>c)?'draw':null;
}

function minimax(board, isMax, depth, alpha, beta){
  const result=checkWinner(board);
  if(result==='B')return 10-depth;
  if(result==='A')return depth-10;
  if(result==='draw')return 0;
  const empty=board.map((v,i)=>v===null?i:-1).filter(i=>i>=0);
  if(isMax){
    let best=-Infinity;
    for(const i of empty){
      board[i]='B'; const val=minimax(board,false,depth+1,alpha,beta); board[i]=null;
      best=Math.max(best,val); alpha=Math.max(alpha,val);
      if(beta<=alpha)break;
    }
    return best;
  } else {
    let best=Infinity;
    for(const i of empty){
      board[i]='A'; const val=minimax(board,true,depth+1,alpha,beta); board[i]=null;
      best=Math.min(best,val); beta=Math.min(beta,val);
      if(beta<=alpha)break;
    }
    return best;
  }
}

function aiMove(){
  const empty=tttBoard.map((v,i)=>v===null?i:-1).filter(i=>i>=0);
  if(!empty.length)return;

  let idx;
  if(tttDifficulty==='easy'){
    // Pure random
    idx=rand(empty);
  } else if(tttDifficulty==='medium'){
    // 60% smart, 40% random
    if(Math.random()<0.6){
      idx=getBestMove();
    } else {
      idx=rand(empty);
    }
  } else {
    // Perfect minimax
    idx=getBestMove();
  }
  placeAt(idx,'B');
}

function getBestMove(){
  const empty=tttBoard.map((v,i)=>v===null?i:-1).filter(i=>i>=0);
  let best=-Infinity, bestIdx=empty[0];
  for(const i of empty){
    tttBoard[i]='B';
    const val=minimax(tttBoard,false,0,-Infinity,Infinity);
    tttBoard[i]=null;
    if(val>best){best=val;bestIdx=i;}
  }
  return bestIdx;
}

function placeAt(idx, mark){
  tttBoard[idx]=mark;
  // animate
  const cells=document.querySelectorAll('.ttt-cell');
  if(cells[idx]){
    cells[idx].classList.add('taken','place-anim');
    cells[idx].innerHTML=mark==='A'?girlA(46):girlB(46);
  }
  const result=checkWinner(tttBoard);
  if(result&&result!=='draw'){
    tttActive=false;
    highlightWin(result);
    setTimeout(()=>{
      if(tttVsAI){
        if(result===tttPlayerMark){tttScores.player++;setFeedback(true,'🎉 Vyhrála jsi! Rumi je nejlepší!');}
        else{tttScores.ai++;setFeedback(false,'😈 Mira vyhrála! Zkus to znovu!');}
      } else {
        const name=result==='A'?'Hráč 1 💗':'Hráč 2 💜';
        if(result==='A')tttScores.player++;else tttScores.p2++;
        setFeedback(true,`🎉 Vyhrál${result==='A'?'a':''} ${name}!`);
      }
      setTimeout(()=>renderTTT(true),800);
    },400);
    return;
  }
  if(result==='draw'){
    tttActive=false;
    tttScores.draw++;
    setTimeout(()=>{setFeedback(false,'🤝 Remíza!');setTimeout(()=>renderTTT(true),800);},300);
    return;
  }
  tttTurn=tttTurn==='A'?'B':'A';
  updateTurnBar();
  // AI moves
  if(tttVsAI&&tttTurn==='B'&&tttActive){
    setTimeout(()=>{
      updateTurnBar(true);
      setTimeout(aiMove,600);
    },200);
  }
}

function highlightWin(winner){
  const cells=document.querySelectorAll('.ttt-cell');
  for(const[a,b,c] of WIN_LINES){
    if(tttBoard[a]===winner&&tttBoard[b]===winner&&tttBoard[c]===winner){
      [a,b,c].forEach(i=>{ if(cells[i])cells[i].classList.add('win-cell'); });
      break;
    }
  }
}

function updateTurnBar(thinking=false){
  const bar=document.getElementById('turn-bar');
  if(!bar)return;
  if(thinking){
    bar.className='turn-bar thinking';
    bar.innerHTML=`🤖 Tablet přemýšlí...`;
    return;
  }
  if(tttVsAI){
    if(tttTurn==='A'){bar.className='turn-bar tA';bar.innerHTML=`${girlA(24)} Rumi — tvůj tah!`;}
    else{bar.className='turn-bar tB';bar.innerHTML=`${girlC(24)} Mira přemýšlí...`;}
  } else {
    if(tttTurn==='A'){bar.className='turn-bar tA';bar.innerHTML=`${girlA(24)} Rumi na tahu`;}
    else{bar.className='turn-bar tB';bar.innerHTML=`${girlB(24)} Zoey na tahu`;}
  }
}

function renderTTT(newGame=false){
  if(newGame){
    tttBoard=Array(9).fill(null);
    tttTurn='A';
    tttActive=true;
  }
  clearFeedback();
  const el=document.getElementById('game-content');
  const diffLabel=tttVsAI?` · ${tttDifficulty==='easy'?'😊 Lehká':tttDifficulty==='medium'?'🤔 Střední':'🤖 Těžká'}`:'';

  const p1Label=tttVsAI?`${girlA(22)} Ty (Rumi)`:`${girlA(22)} Hráč 1 (Rumi)`;
  const p2Label=tttVsAI?`${girlC(22)} Tablet (Mira)`:`${girlB(22)} Hráč 2 (Zoey)`;

  el.innerHTML=`
    <div class="ttt-wrap">
      <div class="game-label">K-pop piškvorky${diffLabel}</div>
      <div class="ttt-scorebar">
        <div class="ttt-sc"><div class="lbl">${p1Label}</div><div class="val">${tttVsAI?tttScores.player:tttScores.player}</div></div>
        <div class="ttt-sc"><div class="lbl">🤝 Remíza</div><div class="val">${tttScores.draw}</div></div>
        <div class="ttt-sc"><div class="lbl">${p2Label}</div><div class="val">${tttVsAI?tttScores.ai:tttScores.p2}</div></div>
      </div>
      <div class="turn-bar tA" id="turn-bar">${tttVsAI?`${girlA(24)} Tvůj tah!`:`${girlA(24)} Hráč 1 na tahu`}</div>
      <div class="ttt-board" id="ttt-board"></div>
      <div class="ttt-actions">
        <button class="ttt-btn" onclick="renderTTT(true)">🔄 Nová hra</button>
        <button class="ttt-btn" onclick="showTTTPicker()">← Zpět</button>
      </div>
    </div>`;

  const board=el.querySelector('#ttt-board');
  tttBoard.forEach((cell,i)=>{
    const d=document.createElement('div');
    d.className='ttt-cell'+(cell?' taken':'');
    if(cell==='A')d.innerHTML=girlA(46);
    else if(cell==='B')d.innerHTML=(tttVsAI?girlC(46):girlB(46));
    d.onclick=()=>{
      if(!tttActive||tttBoard[i]||(tttVsAI&&tttTurn==='B'))return;
      placeAt(i,'A');
    };
    board.appendChild(d);
  });
}

let talesStreak=0;
function nextTales(){
  clearFeedback();clearNav();answered=false;
  const q=rand(TALES);
  const opts=shuffle([q.film,...q.wrong]);
  const el=document.getElementById('game-content');
  el.innerHTML=`<div class="tales-card"><div class="tales-streak">🔥 Série: ${talesStreak}</div><div class="tales-char"><div>${q.svg}</div><div class="tales-char-name">${q.name.toUpperCase()}</div></div><div class="tales-question">Z jaké pohádky nebo filmu je tato postavička?</div><div class="tales-opts" id="talopts"></div><div class="tales-hint" id="talhint"></div></div>`;
  opts.forEach(o=>{
    const b=document.createElement('button');b.className='tales-opt';b.textContent=o;
    b.onclick=()=>{
      if(answered)return;answered=true;
      const ok=o===q.film;
      b.classList.add(ok?'correct':'wrong');
      document.querySelectorAll('.tales-opt').forEach(x=>{if(x.textContent===q.film)x.classList.add('correct');x.disabled=true;});
      document.getElementById('talhint').textContent='💡 '+q.hint;
      if(ok){talesStreak++;score+=10+(talesStreak>2?5:0);correct++;setFeedback(true,rand(['🌟 Správně!','🎉 Výborně!','⭐ Skvělé!','✨ Bravo!']));setTimeout(nextTales,1200);}
      else{talesStreak=0;setFeedback(false,'Správně: '+q.film);showNext(nextTales);}
      updStats();
    };
    el.querySelector('#talopts').appendChild(b);
  });
}

let writeMode = 'numbers';

let writeCanvas = null, writeCtx = null;
let isDrawing = false;
let penColor = '#26C6DA';
let penSize = 10;
let writeStrokes = [];
let currentStroke = [];
let writeScore = {correct:0, total:0};
let lastPos = null;

function nextWrite(){
  clearFeedback(); clearNav(); answered = false;

  if(writeMode === 'numbers'){
    writeCurrent = String(rand(WRITE_NUMBERS));
  } else {
    writeCurrent = rand(WRITE_LETTERS);
  }

  const tip = CHAR_TIPS[writeCurrent] || (writeCurrent.length > 1 ? 'Napiš pěkně hůlkově!' : 'Napiš znak co nejhezčí!');

  const el = document.getElementById('game-content');
  el.innerHTML = `
    <div class="write-wrap">
      <div class="write-mode-row">
        <button class="wm-btn ${writeMode==='numbers'?'active':''}" onclick="setWriteMode('numbers')">🔢 Číslice 0–100</button>
        <button class="wm-btn ${writeMode==='letters'?'active':''}" onclick="setWriteMode('letters')">🔤 Písmena</button>
      </div>
      <div class="write-progress">Správně: <b>${writeScore.correct}</b> z <b>${writeScore.total}</b></div>
      <div class="write-label">Napiš toto:</div>
      <div class="write-target">${writeCurrent}</div>
      <div class="write-sublabel">${tip}</div>
      <div class="canvas-wrap" id="cwrap" style="position:relative;width:100%;max-width:340px;">
        <div class="guide-overlay" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
          <span class="guide-char" style="font-family:'Fredoka One',cursive;font-size:110px;color:rgba(38,198,218,0.09);user-select:none;line-height:1;">${writeCurrent}</span>
        </div>
        <canvas id="draw-canvas" style="display:block;border-radius:16px;touch-action:none;cursor:crosshair;"></canvas>
      </div>
      <div class="canvas-tools">
        <div class="color-row">
          ${['#26C6DA','#E53935','#9B59B6','#FF9A3C','#43A047','#1565C0','#1a1a1a'].map(c=>
            `<div class="pen-color${c===penColor?' active':''}" style="width:26px;height:26px;border-radius:50%;background:${c};border:3px solid ${c===penColor?'#333':'transparent'};cursor:pointer;" onclick="setPenColor('${c}')"></div>`
          ).join('')}
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          ${[4,9,15].map(s=>`<div onclick="setPenSize(${s})" style="width:${s+16}px;height:${s+16}px;border-radius:50%;background:${penSize===s?'#26C6DA':'#e0f7fa'};border:2px solid ${penSize===s?'#26C6DA':'#b2ebf2'};cursor:pointer;display:flex;align-items:center;justify-content:center;"><div style="width:${s}px;height:${s}px;border-radius:50%;background:${penSize===s?'white':'#333'};"></div></div>`).join('')}
        </div>
        <button class="tool-btn" onclick="clearCanvas()">🗑 Smazat</button>
      </div>
      <button class="write-check-btn" onclick="checkWriting()">✅ Hotovo — zkontrolovat!</button>
      <div class="write-result" id="write-result"></div>
    </div>`;

  writeCanvas = document.getElementById('draw-canvas');
  writeCtx = writeCanvas.getContext('2d');
  writeStrokes = [];
  currentStroke = [];
  lastPos = null;
  setupCanvas();
}

function setupCanvas(){
  const wrap = document.getElementById('cwrap');
  const w = Math.min(340, (wrap.offsetWidth || 300));
  const h = Math.round(w * 0.62);
  writeCanvas.width = w;
  writeCanvas.height = h;
  writeCanvas.style.width = w + 'px';
  writeCanvas.style.height = h + 'px';
  redrawBackground();

  writeCanvas.addEventListener('mousedown', e=>{ isDrawing=true; lastPos=getPos(e); currentStroke=[lastPos]; });
  writeCanvas.addEventListener('mousemove', e=>{ if(!isDrawing)return; const p=getPos(e); drawSegment(lastPos,p); lastPos=p; currentStroke.push(p); });
  writeCanvas.addEventListener('mouseup',   e=>{ if(!isDrawing)return; isDrawing=false; if(currentStroke.length>1)writeStrokes.push([...currentStroke]); currentStroke=[]; });
  writeCanvas.addEventListener('mouseleave',e=>{ if(!isDrawing)return; isDrawing=false; if(currentStroke.length>1)writeStrokes.push([...currentStroke]); currentStroke=[]; });

  writeCanvas.addEventListener('touchstart', e=>{ e.preventDefault(); isDrawing=true; const p=getTouchPos(e); lastPos=p; currentStroke=[p]; },{passive:false});
  writeCanvas.addEventListener('touchmove',  e=>{ e.preventDefault(); if(!isDrawing)return; const p=getTouchPos(e); drawSegment(lastPos,p); lastPos=p; currentStroke.push(p); },{passive:false});
  writeCanvas.addEventListener('touchend',   e=>{ e.preventDefault(); isDrawing=false; if(currentStroke.length>1)writeStrokes.push([...currentStroke]); currentStroke=[]; },{passive:false});
}

function redrawBackground(){
  const w=writeCanvas.width, h=writeCanvas.height;
  writeCtx.fillStyle='#f0fffe';
  writeCtx.fillRect(0,0,w,h);
  // linka uprostřed
  writeCtx.strokeStyle='rgba(38,198,218,0.2)';
  writeCtx.lineWidth=1.5;
  writeCtx.setLineDash([8,8]);
  writeCtx.beginPath(); writeCtx.moveTo(0,h/2); writeCtx.lineTo(w,h/2); writeCtx.stroke();
  writeCtx.setLineDash([]);
  // čáry jako linkovaný sešit
  writeCtx.strokeStyle='rgba(38,198,218,0.08)';
  writeCtx.lineWidth=1;
  for(let y=h*0.25; y<h; y+=h*0.25){
    writeCtx.beginPath(); writeCtx.moveTo(0,y); writeCtx.lineTo(w,y); writeCtx.stroke();
  }
}

function drawSegment(from, to){
  writeCtx.beginPath();
  writeCtx.moveTo(from.x, from.y);
  writeCtx.lineTo(to.x, to.y);
  writeCtx.strokeStyle = penColor;
  writeCtx.lineWidth = penSize;
  writeCtx.lineCap = 'round';
  writeCtx.lineJoin = 'round';
  writeCtx.stroke();
}

function getPos(e){
  const r=writeCanvas.getBoundingClientRect();
  const scaleX=writeCanvas.width/r.width;
  const scaleY=writeCanvas.height/r.height;
  return {x:(e.clientX-r.left)*scaleX, y:(e.clientY-r.top)*scaleY};
}
function getTouchPos(e){
  const t=e.touches[0];
  const r=writeCanvas.getBoundingClientRect();
  const scaleX=writeCanvas.width/r.width;
  const scaleY=writeCanvas.height/r.height;
  return {x:(t.clientX-r.left)*scaleX, y:(t.clientY-r.top)*scaleY};
}

function clearCanvas(){
  writeStrokes=[]; currentStroke=[];
  redrawBackground();
  document.getElementById('write-result').textContent='';
  document.getElementById('cwrap').style.borderColor='#26C6DA';
}

function setPenColor(c){ penColor=c; nextWrite(); }
function setPenSize(s){ penSize=s; nextWrite(); }
function setWriteMode(m){ writeMode=m; nextWrite(); }

function analyzeDrawing(){
  if(writeStrokes.length===0) return null;
  let minX=9999,maxX=0,minY=9999,maxY=0,totalPts=0;
  writeStrokes.forEach(s=>s.forEach(p=>{
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
    if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
    totalPts++;
  }));
  const dw=maxX-minX, dh=maxY-minY;
  const W=writeCanvas.width, H=writeCanvas.height;
  return {
    dw, dh, totalPts,
    numStrokes: writeStrokes.length,
    aspect: dh>0?dw/dh:0,
    coverage: (dw*dh)/(W*H),
    relW: dw/W, relH: dh/H
  };
}

function checkWriting(){
  const info = analyzeDrawing();
  const resDiv = document.getElementById('write-result');
  const wrap = document.getElementById('cwrap');

  if(!info || info.totalPts < 8){
    resDiv.textContent = '✏️ Nejprve něco napiš!';
    resDiv.className = 'write-result no';
    return;
  }

  writeScore.total++;

  // Minimální velikost kresby
  const bigEnough = info.dw > 25 && info.dh > 25;
  const hasInk = info.coverage > 0.008;

  let ok = false;

  if(!bigEnough || !hasInk){
    ok = false;
  } else {
    ok = shapeOk(writeCurrent, info);
  }

  if(ok){
    writeScore.correct++;
    score += 10; correct++; updStats();
    resDiv.textContent = rand(['🌟 Výborně! Krásně napsáno!','⭐ Super! Přesně tak!','🎉 Perfektní! Tak dál!','✨ Bravo! Skvělé psaní!']);
    resDiv.className = 'write-result ok';
    wrap.style.borderColor = '#43A047';
    // nakresli zelenou fajfku přes canvas
    drawTick();
    setTimeout(()=>{ wrap.style.borderColor='#26C6DA'; nextWrite(); }, 1800);
  } else {
    resDiv.textContent = `🤔 Zkus to znovu! Podívej se na vzor: ${writeCurrent}`;
    resDiv.className = 'write-result no';
    wrap.style.borderColor = '#E53935';
    showNext(nextWrite);
  }
}

function drawTick(){
  const w=writeCanvas.width, h=writeCanvas.height;
  writeCtx.strokeStyle='rgba(67,160,71,0.5)';
  writeCtx.lineWidth=12;
  writeCtx.lineCap='round';
  writeCtx.lineJoin='round';
  writeCtx.beginPath();
  writeCtx.moveTo(w*0.2, h*0.5);
  writeCtx.lineTo(w*0.42, h*0.75);
  writeCtx.lineTo(w*0.8, h*0.22);
  writeCtx.stroke();
}

// Tvarová analýza — tolerantní pro děti 5-7 let
function shapeOk(ch, info){
  const {dw, dh, numStrokes, aspect, relW, relH} = info;

  // Vícemístná čísla — musí být širší
  if(ch.length > 1 && !isNaN(ch)){
    return dw > 50 && dh > 25 && numStrokes >= 1;
  }

  // Jednociferná čísla
  if(ch.length === 1 && !isNaN(ch)){
    const n = parseInt(ch);
    if(n === 1) return aspect < 0.7 && dh > 35;   // musí být spíš svislé
    if(n === 0 || n === 8 || n === 9 || n === 6) return dh > 35 && dw > 20;
    return dh > 30 && dw > 18;
  }

  // Písmena
  if(ch === 'I') return aspect < 0.6 && dh > 35;
  if(ch === 'O') return aspect < 1.8 && aspect > 0.3 && dh > 30;
  if(ch === 'T' || ch === 'L' || ch === 'F' || ch === 'E') return dw > 25 && dh > 30;
  if(ch === 'W' || ch === 'M' || ch === 'X') return dw > 40 && dh > 25;
  if(ch === 'CH') return dw > 55 && dh > 30;
  if(ch === 'C' || ch === 'Č' || ch === 'S' || ch === 'Š') return dh > 30 && dw > 18;
  if(ch === 'A' || ch === 'V' || ch === 'Y') return dh > 35 && dw > 25;

  // Výchozí — cokoliv přiměřeně velkého
  return dh > 28 && dw > 15;
}
